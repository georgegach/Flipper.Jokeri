name: "Catalog: real bundler"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-char SHA to validate (default: this ref)"
        required: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "Bundle as the catalog would"
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          repository: flipperdevices/flipper-application-catalog
          path: catalog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bundler requirements
        working-directory: catalog
        run: python3 -m pip install -r tools/requirements.txt

      - name: Stage our manifest where the bundler expects it
        run: |
          SHA="${{ inputs.commit_sha || github.sha }}"
          echo "Validating commit $SHA"
          mkdir -p catalog/applications/Games/jokeri
          sed "s/^\( *commit_sha: *\).*/\1$SHA/" app/catalog/manifest.yml \
            > catalog/applications/Games/jokeri/manifest.yml
          cat catalog/applications/Games/jokeri/manifest.yml

      - name: Run the bundler
        working-directory: catalog
        run: |
          export UFBT_HOME="$PWD/.ufbt"
          python3 tools/bundle.py --nolint \
            applications/Games/jokeri/manifest.yml bundle.zip

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jokeri-catalog-bundle
          path: catalog/bundle.zip
          retention-days: 30
