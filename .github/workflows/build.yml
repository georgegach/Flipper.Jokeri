name: "FAP: Build and Release"
# Builds the app for the dev and release SDK channels.
#
# GitHub-hosted runners ONLY. This repository is public, so `pull_request` runs
# fork-authored code — a self-hosted runner here would hand strangers a shell on
# the host. Do not add one.

on:
  push:
    branches:
      # dev is where work lands; main is what the Apps Catalog pins. Both build,
      # but every publishing step below is gated on main/tags, so a dev push
      # compiles and runs the catalog preflight without touching a release.
      - main
      - dev
    tags:
      - "v*"
  pull_request:
  schedule:
    # Weekly: catches SDK-channel drift without nightly noise.
    - cron: "1 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write # rolling latest-build release + versioned tags

# Two pushes in quick succession would otherwise race to force-move `latest-build` and
# upload assets to it, and the loser can leave the release carrying a stale FAP.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything the Apps Catalog bundler checks that does NOT need the SDK. Runs in
  # parallel with the build so a metadata mistake surfaces in seconds, not weeks later in
  # a submission PR. Mirrors flipperdevices/flipper-application-catalog tools/bundle.py
  # and tools/flipp_catalog/markdown_filter.py — if this passes, `bundle.py` should too.
  catalog-checks:
    runs-on: ubuntu-latest
    name: "Catalog: metadata preflight"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog metadata
        run: python3 tools/catalog_preflight.py

      # The full bundler cannot reach its Markdown check until screenshots exist —
      # _process_assets runs first and aborts. The filter is pure Python though, so run
      # the real one here against the two files it would judge. Soft-fails if their repo
      # is unreachable: catalog_preflight.py already covers this, less authoritatively.
      - name: Markdown subset, via the catalog's own filter
        run: |
          python3 -m pip install --quiet 'Markdown==3.7'
          mkdir -p /tmp/filt
          curl -sfL --retry 2 -o /tmp/filt/markdown_filter.py \
            https://raw.githubusercontent.com/flipperdevices/flipper-application-catalog/main/tools/flipp_catalog/markdown_filter.py \
            || { echo "::warning::could not fetch the catalog's filter — relying on the local mirror"; exit 0; }
          PYTHONPATH=/tmp/filt python3 - <<'PY'
          import sys
          from markdown import Markdown
          from markdown_filter import BasicFormattingEnforcingExtension

          rc = 0
          for path in ("CHANGELOG.md", "catalog/description.md"):
              try:
                  Markdown(extensions=[BasicFormattingEnforcingExtension()]).convert(
                      open(path, encoding="utf-8").read()
                  )
                  print(f"markdown OK (real filter): {path}")
              except Exception as e:
                  print(f"::error::{path}: {e}")
                  rc = 1
          sys.exit(rc)
          PY

  ufbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1 # serialize so both channels can update the same rolling release
      matrix:
        include:
          - name: dev channel
            sdk-channel: dev
          - name: release channel
            sdk-channel: release
    name: "ufbt: Build for ${{ matrix.name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          app-dir: .

      - name: FAP size report
        # A .fap is an ELF; arm-none-eabi-size reports .text/.rodata/.data/.bss.
        # Soft-fail: a missing `size` tool must never mask a green build.
        continue-on-error: true
        run: |
          FAP='${{ steps.build-app.outputs.fap-artifacts }}'
          echo "### FAP size — ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$FAP" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          SIZE=$(find "$HOME/.ufbt" -type f -name 'arm-none-eabi-size' 2>/dev/null | head -1)
          if [ -n "$SIZE" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            "$SIZE" -A "$FAP" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Get short git SHA
        id: get_sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload app artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jokeri-${{ matrix.sdk-channel }}-${{ steps.get_sha.outputs.sha_short }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
          retention-days: 30

      - name: Stage channel-named FAP
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/gj-release
          cp ${{ steps.build-app.outputs.fap-artifacts }} \
             /tmp/gj-release/jokeri-${{ matrix.sdk-channel }}.fap

      # A rolling prerelease always carries the current FAP. The tag is force-moved
      # to HEAD and the SHA + date go in the *name*, because GitHub never updates a
      # release's published_at — without this it reads as abandoned on mobile even
      # when the assets are minutes old.
      - name: Move rolling tag to HEAD
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest-build
          git push -f origin refs/tags/latest-build

      - name: Update rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest build — ${{ steps.get_sha.outputs.sha_short }}"
          prerelease: true
          make_latest: false
          body: |
            Rolling build from `main`, rebuilt on every push.

            Commit `${{ github.sha }}`

            Use **jokeri-release.fap** on official stable firmware, or
            **jokeri-dev.fap** on official dev/RC. The wrong channel reports an API
            version mismatch on launch. For a stable version, prefer the
            [Apps Catalog](https://lab.flipper.net/apps) or a `v*` release below.
          files: /tmp/gj-release/jokeri-${{ matrix.sdk-channel }}.fap

      # Versioned releases are what the Apps Catalog submission points at, and the only
      # ones that stay retrievable — the rolling assets are overwritten every push.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          prerelease: false
          body_path: CHANGELOG.md
          files: /tmp/gj-release/jokeri-${{ matrix.sdk-channel }}.fap
