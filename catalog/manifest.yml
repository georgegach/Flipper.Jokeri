# Flipper Apps Catalog manifest.
#
# This is the file to copy into a PR against flipperdevices/flipper-application-catalog
# at applications/Games/jokeri/manifest.yml. It lives here so it is version-controlled
# alongside the commit it pins. See SUBMITTING.md.
#
# name / id / category / version are deliberately absent: the catalog reads them from
# application.fam. Duplicating them here is how they drift.
sourcecode:
  type: git
  location:
    origin: https://github.com/georgegach/Flipper.Jokeri.git
    commit_sha: REPLACE_WITH_TAGGED_COMMIT
author: "George Gach"
changelog: "@./CHANGELOG.md"
description: "@./catalog/description.md"
screenshots:
  - "./screenshots/table-landscape.png"
  - "./screenshots/joker-landscape.png"
  - "./screenshots/bidding-portrait.png"
  - "./screenshots/table-portrait.png"
  - "./screenshots/standings-landscape.png"
  - "./screenshots/georgian-landscape.png"
  - "./screenshots/georgian-portrait.png"
  - "./screenshots/settings-landscape.png"
